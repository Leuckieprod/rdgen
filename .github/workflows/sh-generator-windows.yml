name: Custom Windows Client Generator
run-name: Custom Windows Client Generator

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version to build'
        required: true
        default: ''
        type: string
      zip_url:
        description: 'url to zip of json'
        required: true
        default: ''
        type: string

env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  FLUTTER_ELINUX_VERSION: "3.16.9"

  TAG_NAME: "${{ inputs.upload-tag }}"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"

  VERSION: "${{ inputs.version }}"
  NDK_VERSION: "r28c"

  ANDROID_SIGNING_KEY: "${{ secrets.ANDROID_SIGNING_KEY }}"
  MACOS_P12_BASE64: "${{ secrets.MACOS_P12_BASE64 }}"

  UPLOAD_ARTIFACT: "true"

  SIGN_BASE_URL: "${{ secrets.SIGN_BASE_URL }}"
  STATUS_URL: "${{ secrets.GENURL }}/updategh"

  # IMPORTANT :
  # LLVM_PATH n'existe pas dans le workflow.
  # On utilise directement le chemin LLVM installé sur le runner.
  LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

jobs:

  setup:
    uses: ./.github/workflows/fetch-encrypted-secrets.yml
    with:
      zip_url_json: ${{ inputs.zip_url }}

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      version: ${{ inputs.version }}

  build-RustDeskTempTopMostWindow:
    needs: setup
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10
    secrets: inherit

    strategy:
      fail-fast: false

  build-for-windows-flutter:
    name: Build Windows

    needs:
      - build-RustDeskTempTopMostWindow
      - generate-bridge
      - setup

    runs-on: ${{ matrix.job.os }}

    strategy:
      fail-fast: false

      matrix:
        job:
          - {
              target: x86_64-pc-windows-msvc,
              os: windows-2022,
              arch: x86_64,
              vcpkg-triplet: x64-windows-static
            }

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download encrypted secrets
        uses: actions/download-artifact@v4
        with:
          name: encrypted-secrets-zip

      - name: Load Secrets
        uses: ./.github/actions/decrypt-secrets
        with:
          zip_password: ${{ secrets.ZIP_PASSWORD }}

      - name: Finalize and Cleanup zip/json
        if: always()
        continue-on-error: true
        uses: fjogeleit/http-request-action@v1
        with:
          url: "${{ secrets.GENURL }}/cleanzip"
          method: "POST"
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"uuid": "${{ env.uuid }}"}'

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Set rdgen value
        if: ${{ env.rdgen == 'true' }}
        shell: pwsh
        run: |
          echo "STATUS_URL=${{ secrets.GENURL }}/updategh" >> $env:GITHUB_ENV

      - name: Set API server value
        if: ${{ env.rdgen == 'false' }}
        shell: pwsh
        run: |
          echo "STATUS_URL=${{ env.apiServer }}/api/updategh" >> $env:GITHUB_ENV

      - name: Checkout RustDesk source - version
        if: ${{ env.VERSION != 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: refs/tags/${{ env.VERSION }}
          submodules: recursive

      - name: Checkout RustDesk source - master
        if: ${{ env.VERSION == 'master' }}
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      # ------------------------------------------------------------
      # LLVM
      # ------------------------------------------------------------

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Check LLVM installation
        shell: pwsh
        run: |
          Write-Host "LLVM_PATH:"
          Write-Host $env:LLVM_PATH

          Write-Host ""
          Write-Host "LIBCLANG_PATH:"
          Write-Host $env:LIBCLANG_PATH

          Write-Host ""
          Write-Host "clang:"
          clang --version

      - name: Install ImageMagick on Windows
        run: |
          choco install -y imagemagick.app --no-progress
          Get-ChildItem -Path "${env:ProgramFiles}" |
            ForEach-Object { $_.FullName } |
            Select-String -Pattern "[\/\\]ImageMagick[^\/\\]*$" |
            Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Fix flutter_gpu_texture_renderer
        shell: bash
        run: |
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.lock
          sed -i -e 's|2ded7f146437a761ffe6981e2f742038f85ca68d|08a471bb8ceccdd50483c81cdfa8b81b07b14b87|' ./flutter/pubspec.yaml

      # ------------------------------------------------------------
      # CUSTOM NAME
      # ------------------------------------------------------------

      - name: Change appname to custom
        if: env.appname != 'rustdesk'
        continue-on-error: true
        shell: bash
        run: |

          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./Cargo.toml

          sed -i -e 's|description = "RustDesk Remote Desktop"|description = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|ProductName = "RustDesk"|ProductName = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|FileDescription = "RustDesk Remote Desktop"|FileDescription = "${{ env.appname }}"|' ./libs/portable/Cargo.toml
          sed -i -e 's|OriginalFilename = "rustdesk.exe"|OriginalFilename = "${{ env.appname }}.exe"|' ./libs/portable/Cargo.toml

          sed -i -e 's|const APP_PREFIX: \&str = "rustdesk";|const APP_PREFIX: \&str = "${{ env.appname }}";|' ./libs/portable/src/main.rs

          sed -i -e 's|"RustDesk Remote Desktop"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|VALUE "InternalName", "rustdesk" "\0"|VALUE "InternalName", "${{ env.appname }}" "\0"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"rustdesk.exe"|"${{ env.filename }}"|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|"RustDesk"|"${{ env.appname }}"|' ./flutter/windows/runner/Runner.rc

          if [ ! -z "${{ env.compname }}" ]; then
            find ./src/lang -name "*.rs" -exec sed -i '/powered_by_me/s|RustDesk|${{ env.compname }}|g' {} \;
          fi

          find ./src/lang -name "*.rs" -exec sed -i -e 's|RustDesk|${{ env.appname }}|' {} \;

          sed -i -e 's|rustdesk.com|${{ env.urlLink }}|' ./res/msi/Package/License.rtf

      - name: Fix registry if appname has a space
        if: contains(env.appname, ' ')
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|reg add {}|reg add \\\"{}\\\"|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext} /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\DefaultIcon\\\" /f|' ./src/platform/windows.rs
          sed -i -e 's|reg add HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell /f|reg add \\\"HKEY_CLASSES_ROOT\\\\.{ext}\\\\shell\\\" /f|' ./src/platform/windows.rs

      # ------------------------------------------------------------
      # COMPANY
      # ------------------------------------------------------------

      - name: Change company name
        if: env.compname != 'Purslane Ltd'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./res/msi/Package/License.rtf
          sed -i -e 's|Purslane Tech Pte. Ltd.|${{ env.compname }}|' ./src/main.rs

          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e 's|PURSLANE|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/preprocess.py
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./flutter/windows/runner/Runner.rc
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./libs/portable/Cargo.toml
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./res/msi/Package/License.rtf
          sed -i -e 's|Purslane Ltd|${{ env.compname }}|' ./src/main.rs

      # ------------------------------------------------------------
      # URL
      # ------------------------------------------------------------

      - name: Change URL to custom
        if: env.urlLink != 'https://rustdesk.com'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|Homepage: https://rustdesk.com|Homepage: ${{ env.urlLink }}|' ./build.py
          sed -i -e "s|launchUrl(Uri.parse('https://rustdesk.com'));|launchUrl(Uri.parse('${{ env.urlLink }}'));|" ./flutter/lib/common.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com');|launchUrlString('${{ env.urlLink }}');|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|launchUrlString('https://rustdesk.com/privacy.html')|launchUrlString('${{ env.urlLink }}/privacy.html')|" ./flutter/lib/desktop/pages/desktop_setting_page.dart
          sed -i -e "s|const url = 'https://rustdesk.com/';|const url = '${{ env.urlLink }}';|" ./flutter/lib/mobile/pages/settings_page.dart
          sed -i -e "s|https://rustdesk.com/privacy.html|${{ env.urlLink }}/privacy.html|" ./flutter/lib/desktop/pages/install_page.dart

      - name: Change download link
        if: env.downloadLink != 'https://rustdesk.com/download'
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/desktop/pages/desktop_home_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./flutter/lib/mobile/pages/connection_page.dart
          sed -i -e 's|https://rustdesk.com/download|${{ env.downloadLink }}|' ./src/ui/index.tis
          sed -i -e 's|&download_url|"${{ env.downloadLink }}"|' ./src/updater.rs

      # ------------------------------------------------------------
      # SERVER / KEY
      # ------------------------------------------------------------

      - name: Set server, key, and apiserver
        continue-on-error: true
        shell: bash
        run: |
          sed -i -e 's|rs-ny.rustdesk.com|${{ env.server }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=|${{ env.key }}|' ./libs/hbb_common/src/config.rs
          sed -i -e 's|https://admin.rustdesk.com|${{ env.apiServer }}|' ./src/common.rs

      # ------------------------------------------------------------
      # PATCHES
      # ------------------------------------------------------------

      - name: Allow custom.txt
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/allowCustom.py -OutFile allowCustom.py
            python allowCustom.py

            Invoke-WebRequest -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/removeSetupServerTip.diff -OutFile removeSetupServerTip.diff
            git apply removeSetupServerTip.diff

      - name: Install Flutter
        uses: subosito/flutter-action@v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Replace Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release

          Move-Item `
            -Force `
            windows-x64-release/* `
            C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))

          [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]] &&
            git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      # ------------------------------------------------------------
      # RUST
      # ------------------------------------------------------------

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      # ------------------------------------------------------------
      # VCPKG
      # ------------------------------------------------------------

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --triplet ${{ matrix.job.vcpkg-triplet }} \
            --x-install-root="$VCPKG_ROOT/installed"; then

            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done

            exit 1
          fi

          head -n 100 \
            "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

      # ------------------------------------------------------------
      # ICON
      # ------------------------------------------------------------

      - name: Download custom icon
        if: ${{ env.iconlink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          command: |
            Invoke-WebRequest `
              -Uri "${{ env.iconlink_url }}/get_png?filename=${{ env.iconlink_file }}&uuid=${{ env.iconlink_uuid }}" `
              -OutFile ./res/iconx.png

            Move-Item ./res/icon.ico ./res/icon.ico.bak
            Move-Item ./res/icon.png ./res/icon.png.bak
            Move-Item ./res/tray-icon.ico ./res/tray-icon.ico.bak

            Move-Item ./res/iconx.png ./res/icon.png

            Move-Item ./res/32x32.png ./res/32x32.png.bak
            Move-Item ./res/64x64.png ./res/64x64.png.bak
            Move-Item ./res/128x128.png ./res/128x128.png.bak
            Move-Item ./res/128x128@2x.png ./res/128x128@2x.png.bak

            magick ./res/icon.png -define icon:auto-resize=256,64,48,32,16 ./res/icon.ico

            Copy-Item ./res/icon.ico ./res/tray-icon.ico

            magick ./res/icon.png -resize 32x32 ./res/32x32.png
            magick ./res/icon.png -resize 64x64 ./res/64x64.png
            magick ./res/icon.png -resize 128x128 ./res/128x128.png
            magick ./res/128x128.png -resize 200% ./res/128x128@2x.png

      - name: Update ui.rs icon
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        shell: bash
        run: |
          cp ./src/ui.rs ./src/ui.rs.bak

          b64=$(base64 -w0 < ./res/icon.png)

          perl -0777 \
            -pe "s|iVBORw0KGgoAAAANSUhEUgAAAIAAAACACAYAAADDPmHL[A-Za-z0-9+/=]+|$b64|g" \
            -i.bak ./src/ui.rs

          b64=""

      - name: Fix connection delay
        continue-on-error: true
        if: ${{ env.delayFix == 'true' }}
        shell: bash
        run: |
          sed -i -e 's|!key.is_empty()|false|' ./src/client.rs

      - name: Use X for offline display
        if: env.xOffline == 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          continue_on_error: true
          command: |
            Invoke-WebRequest `
              -Uri https://raw.githubusercontent.com/bryangerlach/rdgen/refs/heads/master/.github/patches/xoffline.diff `
              -OutFile xoffline.diff

            git apply xoffline.diff

      - name: Remove new version notification
        continue-on-error: true
        if: env.removeNewVersionNotif == 'true'
        shell: bash
        run: |
          sed -i -e 's|updateUrl.isNotEmpty|false|' ./flutter/lib/desktop/pages/desktop_home_page.dart

      - name: Replace Flutter icons
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        shell: pwsh
        run: |
          cd ./flutter
          flutter pub get
          flutter pub run flutter_launcher_icons
          cd ..

      # ------------------------------------------------------------
      # BUILD RUSTDESK
      # ------------------------------------------------------------

      - name: Build rustdesk
        shell: pwsh

        # IMPORTANT :
        # Ne plus utiliser env.LLVM_PATH ici.
        # LLVM_PATH n'est pas défini par notre workflow.
        env:
          LIBCLANG_PATH: "C:\\Program Files\\LLVM\\bin"

        run: |

          Write-Host "========== LLVM =========="
          Write-Host "LIBCLANG_PATH=$env:LIBCLANG_PATH"

          if (!(Test-Path "$env:LIBCLANG_PATH")) {
            Write-Error "LIBCLANG_PATH does not exist!"
            exit 1
          }

          Write-Host "========== Rust =========="
          rustc --version
          cargo --version

          Write-Host "========== Build RustDesk =========="

          python3 .\build.py `
            --portable `
            --hwcodec `
            --flutter `
            --vram `
            --skip-portable-pack

          if (!(Test-Path "./flutter/build/windows/x64/runner/Release")) {
            Write-Error "RustDesk Release directory was not created."
            exit 1
          }

          Move-Item `
            ./flutter/build/windows/x64/runner/Release `
            ./rustdesk

          # --------------------------------------------------------
          # USBMMIDD
          # --------------------------------------------------------

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip `
            -OutFile usbmmidd_v2.zip

          Expand-Archive `
            usbmmidd_v2.zip `
            -DestinationPath . `
            -Force

          Remove-Item `
            usbmmidd_v2\Win32 `
            -Recurse `
            -Force

          Remove-Item `
            "usbmmidd_v2\deviceinstaller64.exe",
            "usbmmidd_v2\deviceinstaller.exe",
            "usbmmidd_v2\usbmmidd.bat" `
            -Force

          Move-Item `
            -Force `
            .\usbmmidd_v2 `
            ./rustdesk

          # --------------------------------------------------------
          # PRINTER DRIVER
          # --------------------------------------------------------

          try {

            Invoke-WebRequest `
              -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip `
              -OutFile rustdesk_printer_driver_v4-1.4.zip

            Invoke-WebRequest `
              -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip `
              -OutFile printer_driver_adapter.zip

            Invoke-WebRequest `
              -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums `
              -OutFile sha256sums

            $checksum_driver =
              (Select-String `
                -Path .\sha256sums `
                -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value

            $downloadsum_driver =
              (Get-FileHash `
                -Path rustdesk_printer_driver_v4-1.4.zip `
                -Algorithm SHA256).Hash

            $checksum_adapter =
              (Select-String `
                -Path .\sha256sums `
                -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value

            $downloadsum_adapter =
              (Get-FileHash `
                -Path printer_driver_adapter.zip `
                -Algorithm SHA256).Hash

            if (
              $checksum_driver -eq $downloadsum_driver -and
              $checksum_adapter -eq $downloadsum_adapter
            ) {

              Write-Output "Printer driver checksums match."

              Expand-Archive `
                rustdesk_printer_driver_v4-1.4.zip `
                -DestinationPath .

              New-Item `
                -ItemType Directory `
                -Path ./rustdesk/drivers `
                -Force

              Move-Item `
                -Force `
                .\rustdesk_printer_driver_v4-1.4 `
                ./rustdesk/drivers/RustDeskPrinterDriver

              Expand-Archive `
                printer_driver_adapter.zip `
                -DestinationPath .

              Move-Item `
                -Force `
                .\printer_driver_adapter.dll `
                ./rustdesk

            } else {

              Write-Output "Printer driver checksum mismatch."

            }

          } catch {

            Write-Host "Ignore printer driver error."

          }

      # ------------------------------------------------------------
      # ICON / LOGO
      # ------------------------------------------------------------

      - name: Icon stuff
        if: ${{ env.iconlink_url != 'false' }}
        continue-on-error: true
        shell: pwsh
        run: |
          Move-Item `
            ./rustdesk/data/flutter_assets/assets/icon.svg `
            ./rustdesk/data/flutter_assets/assets/icon.svg.bak

          magick `
            ./res/icon.png `
            ./rustdesk/data/flutter_assets/assets/icon.svg

      - name: Logo stuff
        if: ${{ env.logolink_url != 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: pwsh
          continue_on_error: true
          command: |
            Invoke-WebRequest `
              -Uri "${{ env.logolink_url }}/get_png?filename=${{ env.logolink_file }}&uuid=${{ env.logolink_uuid }}" `
              -OutFile ./rustdesk/data/flutter_assets/assets/logo.png

      # ------------------------------------------------------------
      # RUNNER.RES
      # ------------------------------------------------------------

      - name: Find Runner.res
        continue-on-error: true
        shell: bash
        run: |

          runner_res=$(find . -name "Runner.res")

          if [ "$runner_res" == "" ]; then
            echo "Runner.res: not found"
          else
            echo "Runner.res: $runner_res"
            cp "$runner_res" ./libs/portable/Runner.res
            ls -l ./libs/portable/Runner.res
          fi

      - name: Download RustDeskTempTopMostWindow artifacts
        uses: actions/download-artifact@v4
        if: env.UPLOAD_ARTIFACT == 'true'
        with:
          name: topmostwindow-artifacts
          path: "./rustdesk"

      # ------------------------------------------------------------
      # SIGN DLLS
      # ------------------------------------------------------------

      - name: Zip DLLs
        continue-on-error: true
        shell: pwsh
        run: |
          Compress-Archive `
            -Path ./rustdesk/*.dll, ./rustdesk/*.exe `
            -DestinationPath ./rustdesk/unsigned_files.zip `
            -CompressionLevel Fastest

      - name: Sign DLLs
        continue-on-error: true
        shell: bash
        run: |

          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] &&
             [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then

            curl -X POST \
              -F "file=@./rustdesk/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" \
              -o ./rustdesk/signed_files.zip

          else

            echo "Signing skipped"

            cp \
              ./rustdesk/unsigned_files.zip \
              ./rustdesk/signed_files.zip

          fi

      - name: Unzip DLLs
        continue-on-error: true
        shell: pwsh
        run: |

          Expand-Archive `
            -Path ./rustdesk/signed_files.zip `
            -DestinationPath ./rustdesk/ `
            -Force

          Remove-Item ./rustdesk/unsigned_files.zip -Force
          Remove-Item ./rustdesk/signed_files.zip -Force

      # ------------------------------------------------------------
      # CUSTOM TXT
      # ------------------------------------------------------------

      - name: Create custom.txt
        shell: bash
        run: |
          echo -n "${{ env.custom }}" > ./rustdesk/custom_.txt

      # ------------------------------------------------------------
      # PORTABLE EXE
      # ------------------------------------------------------------

      - name: Build self-extracted executable
        shell: bash
        if: env.UPLOAD_ARTIFACT == 'true'
        run: |

          mv \
            "./rustdesk/rustdesk.exe" \
            "./rustdesk/${{ env.appname }}.exe" \
            || echo "rustdesk.exe"

          sed -i '/dpiAware/d' res/manifest.xml

          pushd ./libs/portable

          pip3 install -r requirements.txt

          python3 \
            ./generate.py \
            -f ../../rustdesk/ \
            -o . \
            -e "../../rustdesk/${{ env.appname }}.exe"

          popd

          mkdir -p ./SignOutput

          mv \
            ./target/release/rustdesk-portable-packer.exe \
            "./SignOutput/rustdesk.exe"

      # ------------------------------------------------------------
      # MSI
      # ------------------------------------------------------------

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build MSI
        continue-on-error: true
        if: env.UPLOAD_ARTIFACT == 'true'
        shell: pwsh
        run: |

          $myappname = "${{ env.appname }}" -replace '\s','_'

          Copy-Item `
            "rustdesk/${{ env.appname }}.exe" `
            "rustdesk/${myappname}.exe" `
            -ErrorAction SilentlyContinue

          Push-Location ./res/msi

          python preprocess.py `
            --app-name "$myappname" `
            --arp `
            -d ../../rustdesk

          nuget restore msi.sln

          msbuild msi.sln `
            -p:Configuration=Release `
            -p:Platform=x64 `
            /p:TargetVersion=Windows10

          Copy-Item `
            ./Package/bin/x64/Release/en-us/Package.msi `
            ../../SignOutput/rustdesk-latest.msi

          Move-Item `
            ./Package/bin/x64/Release/en-us/Package.msi `
            ../../SignOutput/rustdesk.msi

          Get-FileHash `
            ../../SignOutput/rustdesk.msi `
            -Algorithm SHA256

          Pop-Location

      # ------------------------------------------------------------
      # SIGN EXE / MSI
      # ------------------------------------------------------------

      - name: Zip EXE and MSI
        continue-on-error: true
        shell: pwsh
        run: |

          Compress-Archive `
            -Path ./SignOutput/*.exe, ./SignOutput/*.msi `
            -DestinationPath ./SignOutput/unsigned_files.zip `
            -CompressionLevel Fastest

      - name: Sign EXE and MSI
        continue-on-error: true
        shell: bash
        run: |

          if [ ! -z "${{ secrets.SIGN_BASE_URL }}" ] &&
             [ ! -z "${{ secrets.SIGN_API_KEY }}" ]; then

            curl -X POST \
              -F "file=@./SignOutput/unsigned_files.zip" \
              -H "X-API-KEY: ${{ secrets.SIGN_API_KEY }}" \
              -m 900 \
              "${{ secrets.SIGN_BASE_URL }}/sign/" \
              -o ./SignOutput/signed_files.zip

          else

            echo "Signing skipped"

            cp \
              ./SignOutput/unsigned_files.zip \
              ./SignOutput/signed_files.zip

          fi

      - name: Unzip EXE and MSI
        continue-on-error: true
        shell: pwsh
        run: |

          Expand-Archive `
            -Path ./SignOutput/signed_files.zip `
            -DestinationPath ./SignOutput/ `
            -Force

          Remove-Item ./SignOutput/unsigned_files.zip -Force
          Remove-Item ./SignOutput/signed_files.zip -Force

      - name: Rename rustdesk.exe
        shell: pwsh
        run: |

          Move-Item `
            ./SignOutput/rustdesk.exe `
            "./SignOutput/${{ env.filename }}.exe" `
            -ErrorAction SilentlyContinue

      - name: Rename rustdesk.msi
        continue-on-error: true
        shell: pwsh
        run: |

          Move-Item `
            ./SignOutput/rustdesk.msi `
            "./SignOutput/${{ env.filename }}.msi" `
            -ErrorAction SilentlyContinue

      # ------------------------------------------------------------
      # SEND FILES
      # ------------------------------------------------------------

      - name: Send file to rdgen server
        if: ${{ env.rdgen == 'true' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |

            echo "========== FILES TO SEND =========="
            ls -lah ./SignOutput/
            echo "==================================="

            echo "Sending EXE..."
            curl -i \
              -X POST \
              -H "Authorization: Bearer ${{ env.token }}" \
              -F "file=@./SignOutput/${{ env.filename }}.exe" \
              -F "uuid=${{ env.uuid }}" \
              "${{ secrets.GENURL }}/save_custom_client"

            echo ""
            echo "Sending MSI..."
            curl -i \
              -X POST \
              -H "Authorization: Bearer ${{ env.token }}" \
              -F "file=@./SignOutput/${{ env.filename }}.msi" \
              -F "uuid=${{ env.uuid }}" \
              "${{ secrets.GENURL }}/save_custom_client" || true

      - name: Send file to API server
        if: ${{ env.rdgen == 'false' }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          command: |

            curl -i \
              -X POST \
              -H "Content-Type: multipart/form-data" \
              -H "Authorization: Bearer ${{ env.token }}" \
              -F "file=@./SignOutput/${{ env.filename }}.exe" \
              ${{ env.apiServer }}/api/save_custom_client

            curl -i \
              -X POST \
              -H "Content-Type: multipart/form-data" \
              -H "Authorization: Bearer ${{ env.token }}" \
              -F "file=@./SignOutput/${{ env.filename }}.msi" \
              ${{ env.apiServer }}/api/save_custom_client || true

  # --------------------------------------------------------------
  # CLEANUP
  # --------------------------------------------------------------

  cleanup:
    needs:
      - build-for-windows-flutter

    runs-on: ubuntu-latest

    continue-on-error: true

    if: always()

    steps:

      - name: Delete secrets artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: encrypted-secrets-zip
